# Declarative package manifest consumed by run_onchange_before_20-brew-bundle.
# The Darwin base and desktop buckets are unconditional; the remaining Darwin
# buckets are gated on matching chezmoi toggles (see .chezmoi.toml.tmpl). Each
# bucket may carry `brews`, `casks`, and `mas` (objects with `name` and `id`).
packages:
  common:
    brews:
      - btop
      - chezmoi
      - eza
      - fastfetch
      - fd
      - fish
      - fzf
      - gh
      - git-lfs
      - httpie
      - jq
      - ripgrep
      - starship
      - tea
      - uv
      - vim
      - zoxide

  linux:
    brews: []
    casks: []
    codex_casks:
      - codex

  darwin:
    base:
      brews: []
      casks:
        - codex
        - codex-app

    desktop:
      brews:
        - dockutil
      casks:
        - appcleaner
        - bambu-studio
        - ghostty
        - google-chrome
        - logi-options+
        - logseq
        - orbstack
      mas:
        - { name: "Flighty – Live Flight Tracker", id: 1358823008 }
        - { name: "Numbers",                        id: 361304891 }
        - { name: "Pages",                          id: 361309726 }

    socials:
      mas:
        - { name: "Telegram",           id: 747648890 }
        - { name: "WhatsApp Messenger", id: 310633997 }

    work:
      casks:
        - kicad
        - linear
      mas:
        - { name: "Slack for Desktop", id: 803453959 }
        - { name: "Tailscale",         id: 1475387142 }
